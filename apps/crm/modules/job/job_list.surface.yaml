# job_list — list Surface (Phase 01)
# @see docs/phases/01-data-access/tasks/06-surface-yaml.md

id: job_list
displayName: Job list
anchorTable: jobs

tables:
  - jobs
  - customers
  - sites
  - assignments

fields:
  - id: summary
    columns:
      - jobs.id
      - jobs.title
      - jobs.status
      - jobs.scheduled_at

  - id: customer_site
    columns:
      - customers.name
      - sites.label

  - id: financial_terms
    sensitivity: high
    columns:
      - jobs.contract_amount

  - id: assignments
    columns: []
