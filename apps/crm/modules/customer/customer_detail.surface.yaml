# customer_detail — second Surface (Phase 02)
# @see docs/phases/02-ui-sync/tasks/06-surface-yaml.md

id: customer_detail
displayName: Customer detail
anchorTable: customers

tables:
  - customers
  - sites
  - jobs

fields:
  - id: profile
    columns:
      - customers.name
      - customers.phone

  - id: billing
    sensitivity: high
    columns:
      - customers.billing_notes

  - id: sites
    columns:
      - sites.label

  - id: job_history
    columns:
      - jobs.id
      - jobs.title
      - jobs.status
