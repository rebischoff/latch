# role_detail — vocabulary reference (runtime grants are DB data).
# Effective access for system_iam holders is synthesized in PolicyService (P4).
# App roles have no binding on this IAM surface (default deny → 404 hide).

surface: role_detail
forbiddenFieldResponse: 404

roles:
  system_iam:
    rowScope: all
    surfaceActions: [read, write, delete]
    fields:
      - field: catalog
        actions: [read, write]
      - field: surface_bindings
        actions: [read, write]
      - field: grants
        actions: [read, write]
