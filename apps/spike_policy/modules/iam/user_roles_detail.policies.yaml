# user_roles_detail — vocabulary reference (runtime grants are DB data).
# Effective access for system_iam holders is synthesized in PolicyService (P4).
# App roles have no binding on this IAM surface (default deny → 404 hide).

surface: user_roles_detail
forbiddenFieldResponse: 404

roles:
  system_iam:
    rowScope: all
    surfaceActions: [read, write]
    fields:
      - field: profile
        actions: [read]
      - field: role_assignments
        actions: [read, write]
