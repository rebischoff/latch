# Item profile + leaf spec participation + labor phases
id: item_detail
displayName: Item detail
anchorTable: item

fieldActions:
  - read
  - write

surfaceActions:
  - read
  - write
  - delete

tables:
  - item
  - spec_def
  - spec_option

fields:
  - id: profile
    columns:
      - column: item.id
        type: string
      - column: item.name
        type: string
      - column: item.parent_id
        type: string
        nullable: true
      - column: item.node_type
        type: string
      - column: item.sort_order
        type: number
      - column: item.csi_code
        type: string
        nullable: true
  - id: commercial
    columns:
      - column: item.freight_rate_type_id
        type: string
        nullable: true
      - column: item.incidental_rate_type_id
        type: string
        nullable: true
      - column: item.markup_type_id
        type: string
        nullable: true
      - column: item.fallback_unit_cost
        type: number
      - column: item.material_phase_id
        type: string
        nullable: true
  - id: item_labor_phase
    # logical — DAL maps item_labor_phase junction rows (own / writable)
    columns: []
  - id: resolved_labor_phase
    # logical — read-only per-phase merge across ancestry (37ad); gated by item_labor_phase read
    columns: []
  - id: spec_definitions
    # logical — DAL maps spec_def + spec_option for scope roots only (37o UI pivot)
    columns: []
