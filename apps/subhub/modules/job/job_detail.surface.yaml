# Job profile + stakeholders (Overview tab — wave 5a)
id: job_detail
displayName: Job detail
anchorTable: job

fieldActions:
  - read
  - write

surfaceActions:
  - read
  - write
  - complete

tables:
  - job
  - job_party
  - job_party_relation
  - job_condition
  - job_condition_spec
  - job_condition_labor_phase
  - job_line
  - job_line_allocation
  - job_line_spec
  - scope_phase
  - job_field_progress_cell
  - job_progress_report
  - job_progress_report_cell
  - job_issue
  - job_material_request
  - site
  - site_zone
  - estimate

fields:
  - id: profile
    columns:
      - column: job.id
        type: string
      - column: job.title
        type: string
      - column: job.site_id
        type: string
      - column: job.job_kind
        type: string
      - column: job.status
        type: string
      - column: job.estimate_id
        type: string
        nullable: true
  - id: stakeholders
    # logical — DAL maps to job_party; see docs/child-collections.md
    columns: []
  - id: conditions
    # logical — DAL maps to job_condition forest + specs/phases (task 46 W3)
    columns: []
  - id: line_items
    # logical — DAL maps to job_line + allocations + specs (task 46 W2/W4)
    columns: []
  - id: field_progress
    # logical — DAL maps to job_field_progress_cell + derived board/%/lifecycle (task 51)
    # + append-only job_progress_report* on Save when progress changed (task 55)
    columns: []
  - id: field_zone_orders
    # logical — desired Field ☐ Order intents; Save → job_material_request + site_zone_id (task 55/56)
    columns: []
  - id: field_issues
    # logical — pending create/update/resolve/cancel for job_issue; batched Field Save (57/60)
    columns: []
