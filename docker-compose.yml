# Optional — not required for Latch development.
# Default workflow uses Neon; see docs/foundations/development.md
#
# Usage:
#   npm run db:docker:up
#   DATABASE_URL=postgresql://latch:latch@localhost:5432/latch  # in apps/crm/.env.local
#   npm run db:migrate

services:
  postgres:
    image: postgres:16-alpine
    container_name: latch-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-latch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-latch}
      POSTGRES_DB: ${POSTGRES_DB:-latch}
    volumes:
      - latch_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-latch} -d ${POSTGRES_DB:-latch}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  latch_pg_data:
